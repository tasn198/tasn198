<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 236" width="880" height="236" role="img" aria-label="Experience: Graphic Designer, ongoing; Organizer of the Hult Prize at Daffodil International University"><rect x="1" y="1" width="878" height="234" rx="6" fill="#0b1426" stroke="#2a3f66" stroke-width="2"/><rect x="24" y="24" width="10" height="84" fill="#d83a3a"/><text x="52" y="50" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="700" fill="#e6edf3">Graphic Designer</text><text x="52" y="74" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#d83a3a">Ongoing</text><text x="52" y="98" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9db0cc">Logos, branding, banners, social media, menus, slides, certificates, merchandise. Canva, Illustrator, Photoshop.</text><rect x="24" y="132" width="10" height="84" fill="#3b6fe0"/><text x="52" y="158" font-family="Georgia,'Times New Roman',serif" font-size="22" font-weight="700" fill="#e6edf3">Organizer, Hult Prize at DIU</text><text x="52" y="182" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#3b6fe0">Leadership</text><text x="52" y="206" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9db0cc">Also an organizer of several other university events and organizations.</text></svg>